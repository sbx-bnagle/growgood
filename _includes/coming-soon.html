<div class='coming-soon'>
  <div id='js_coming-soon__text' class='subscribe__text'>

    <h2>Coming soon</h2>
    <p>Subscribe below to stay in the loop</p>


    <form
      class = 'subscribe__form'
      id = 'js_coming-soon__form'
    >
      <input 
        id='js_coming-soon__email' 
        type="email" 
        name="email" 
        autocomplete='email' 
        class='subscribe__email js_float-label' 
      >
      <label for='js_coming-soon__email' class='floater js_unfloat'>Your email address</label>    
      <button 
        type='submit'
        data-sitekey='{{ site.recaptcha_sitekey }}'
        data-callback='onSubmit' 
        data-action='submit'
      >Subscribe</button>
    </form>

  </div>
</div>
