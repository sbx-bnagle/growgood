name: Site

# Builds the site with Jekyll and the Grow Good theme (growgood-brand D-003, D-040). Pull
# requests build only, as a check; a push to main builds and deploys to GitHub Pages.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the newsletter Worker
        run: node --test workers/newsletter/test/worker.test.mjs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # The brand checks (growgood-brand D-054, checks/): the brand repo, at the theme release this
      # site pins, runs every check that applies here in one command, tools/checks-site.mjs: copy
      # and accessibility on the built pages, styles on the site's own Sass, and on a pull request
      # the brand judge on the pages it changed, once the ANTHROPIC_API_KEY secret is saved.
      # Report only until launch (O-20); the findings go to the run summary. A new check arrives
      # with a theme release.
      - name: Find the pinned theme release
        id: theme
        run: |
          echo "ref=$(sed -n 's#^remote_theme: sbx-bnagle/growgood-brand@##p' _config.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: sbx-bnagle/growgood-brand
          ref: ${{ steps.theme.outputs.ref }}
          path: .brand

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the brand checks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npm ci --prefix .brand --no-audit --no-fund
          if [ -n "$PR_NUMBER" ]; then
            JUDGE_FILES="$(gh pr diff "$PR_NUMBER" --name-only | tr '\n' ' ')"
            export JUDGE_FILES
          fi
          node .brand/tools/checks-site.mjs .

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
