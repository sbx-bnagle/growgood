name: Site

# Builds the site with Jekyll and the Grow Good theme (growgood-brand D-003, D-040). Pull
# requests build only, as a check; a push to main builds and deploys to GitHub Pages.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the newsletter Worker
        run: node --test workers/newsletter/test/worker.test.mjs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # The copy check (growgood-brand D-054, checks/lint-copy.md): the brand repo's linter, at the
      # theme release this site pins, reads the built pages. Report only until launch (O-20); the
      # findings go to the run summary.
      - name: Find the pinned theme release
        id: theme
        run: |
          echo "ref=$(sed -n 's#^remote_theme: sbx-bnagle/growgood-brand@##p' _config.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: sbx-bnagle/growgood-brand
          ref: ${{ steps.theme.outputs.ref }}
          path: .brand

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the built pages' copy
        env:
          LINT_COPY_TITLE: Copy on the built site
        run: |
          npm ci --prefix .brand --no-audit --no-fund
          node .brand/tools/lint-copy.mjs --report _site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
